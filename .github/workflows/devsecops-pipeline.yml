name: Pipeline DevSecOps End-to-End

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:

  # ============================================================
  # 1. SECRET SCANNING
  # ============================================================
  secret-scanning:
    name: 1. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 2. SAST
  # ============================================================
  sast:
    name: 2. SAST (Semgrep)
    needs: secret-scanning
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Ejecutar Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/security-audit


  # ============================================================
  # 3. SCA
  # ============================================================
  sca:
    name: 3. SCA (Trivy Filesystem)
    needs: secret-scanning
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Escaneo de dependencias con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "app/"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true


  # ============================================================
  # 4. IaC SECURITY
  # ============================================================
  iac-security:
    name: 4. IaC Security (Checkov)
    needs: secret-scanning
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Escaneo de IaC con Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: "."
          framework: "terraform,dockerfile"
          soft_fail: false
          skip_check: "CKV_AWS_18,CKV_AWS_21,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_6,CKV2_AWS_61,CKV2_AWS_62,CKV_AWS_260,CKV2_AWS_5"


  # ============================================================
  # 5. BUILD, SBOM, TRIVY Y PUBLICACIÓN
  # ============================================================
  build-and-sbom:
    name: 5. Build, Container Scan & SBOM
    needs:
      - sast
      - sca
      - iac-security

    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------
      - name: Descargar código
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Login GHCR
      # ----------------------------------------------------------
      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------------------------
      # Metadata
      # ----------------------------------------------------------
      - name: Extraer metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha


      # ----------------------------------------------------------
      # Build local
      # ----------------------------------------------------------
      - name: Compilar imagen Docker local
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}


      # ----------------------------------------------------------
      # Generar SBOM
      # ----------------------------------------------------------
      - name: Generar SBOM con Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json


      # ----------------------------------------------------------
      # Publicar SBOM
      # ----------------------------------------------------------
      - name: Publicar SBOM como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json


      # ----------------------------------------------------------
      # Trivy Container Scan
      # ----------------------------------------------------------
      - name: Escaneo de imagen Docker con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          severity: "CRITICAL"
          exit-code: "0"
          ignore-unfixed: true


      # ----------------------------------------------------------
      # Publicar imagen en GHCR
      # ----------------------------------------------------------
      - name: Publicar imagen en GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}


  # ============================================================
  # 6. FIRMA CRIPTOGRÁFICA CON COSIGN
  # ============================================================
  sign-container:
    name: 6. Firma de Artefacto (Cosign Keyless)
    needs: build-and-sbom
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:

      # ----------------------------------------------------------
      # Instalar Cosign
      # ----------------------------------------------------------
      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3.5.0


      # ----------------------------------------------------------
      # Login GHCR
      # ----------------------------------------------------------
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------------------------
      # Firma Keyless
      # ----------------------------------------------------------
      - name: Firmar imagen mediante Sigstore
        run: |
          IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"

          echo "=========================================="
          echo "Imagen que será firmada:"
          echo "$IMAGE_REF"
          echo "=========================================="

          cosign sign --yes "$IMAGE_REF"