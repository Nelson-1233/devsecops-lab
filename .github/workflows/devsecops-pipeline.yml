name: Pipeline DevSecOps End-to-End

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:

  # ============================================================
  # 1. SECRET SCANNING
  # ============================================================
  secret-scanning:
    name: 1. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 2. SAST - SEMGREP
  # ============================================================
  sast:
    name: 2. SAST (Semgrep)
    needs: secret-scanning
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Ejecutar Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/security-audit
          generateSarif: "1"


  # ============================================================
  # 3. SCA - TRIVY
  # ============================================================
  sca:
    name: 3. SCA (Trivy Filesystem)
    needs: secret-scanning
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Escanear dependencias con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "app/"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"


  # ============================================================
  # 4. IaC SECURITY - CHECKOV
  # ============================================================
  iac-security:
    name: 4. IaC Security (Checkov)
    needs: secret-scanning
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Ejecutar Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: "."
          framework: "terraform,dockerfile"
          soft_fail: false
          skip_check: "CKV_AWS_18,CKV_AWS_21,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_6,CKV2_AWS_61,CKV2_AWS_62,CKV_AWS_260,CKV2_AWS_5"


  # ============================================================
  # 5. BUILD + SBOM + TRIVY + PUSH
  # ============================================================
  build-and-sbom:
    name: 5. Build, Container Scan & SBOM
    needs:
      - sast
      - sca
      - iac-security

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.tags }}

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------
      - name: Descargar código
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # LOGIN GHCR
      # ----------------------------------------------------------
      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------------------------
      # METADATA
      # ----------------------------------------------------------
      - name: Generar metadata de imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long


      # ----------------------------------------------------------
      # BUILD + PUSH
      # ----------------------------------------------------------
      - name: Compilar y publicar imagen Docker
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


      # ----------------------------------------------------------
      # MOSTRAR INFORMACIÓN
      # ----------------------------------------------------------
      - name: Mostrar imagen publicada
        run: |
          echo "=========================================="
          echo "Imagen publicada:"
          echo "${{ steps.meta.outputs.tags }}"
          echo ""
          echo "Digest generado:"
          echo "${{ steps.build.outputs.digest }}"
          echo "=========================================="


      # ----------------------------------------------------------
      # SBOM
      # ----------------------------------------------------------
      - name: Generar SBOM con Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json


      # ----------------------------------------------------------
      # PUBLICAR SBOM
      # ----------------------------------------------------------
      - name: Publicar SBOM como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json


      # ----------------------------------------------------------
      # TRIVY
      # ----------------------------------------------------------
      - name: Escanear imagen Docker con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          severity: "CRITICAL"
          ignore-unfixed: true
          exit-code: "0"


  # ============================================================
  # 6. FIRMA CRIPTOGRÁFICA CON COSIGN
  # ============================================================
  sign-container:
    name: 6. Firma de Artefacto (Cosign Keyless)
    needs: build-and-sbom
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:

      # ----------------------------------------------------------
      # INSTALAR COSIGN
      # ----------------------------------------------------------
      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3.5.0


      # ----------------------------------------------------------
      # LOGIN GHCR
      # ----------------------------------------------------------
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------------------------
      # MOSTRAR REFERENCIA
      # ----------------------------------------------------------
      - name: Mostrar imagen y digest
        run: |
          echo "=========================================="
          echo "Imagen:"
          echo "${{ needs.build-and-sbom.outputs.image_tag }}"
          echo ""
          echo "Digest:"
          echo "${{ needs.build-and-sbom.outputs.image_digest }}"
          echo "=========================================="


      # ----------------------------------------------------------
      # FIRMAR EXACTAMENTE EL DIGEST GENERADO EN EL BUILD
      # ----------------------------------------------------------
      - name: Firmar imagen con Cosign Keyless
        env:
          IMAGE_TAG: ${{ needs.build-and-sbom.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.build-and-sbom.outputs.image_digest }}
        run: |
          IMAGE_REF="${IMAGE_TAG}@${IMAGE_DIGEST}"

          echo "=========================================="
          echo "Imagen que será firmada:"
          echo "$IMAGE_REF"
          echo "=========================================="

          cosign sign --yes "$IMAGE_REF"


      # ----------------------------------------------------------
      # VERIFICAR FIRMA
      # ----------------------------------------------------------
      - name: Verificar firma Cosign
        env:
          IMAGE_TAG: ${{ needs.build-and-sbom.outputs.image_tag }}
          IMAGE_DIGEST: ${{ needs.build-and-sbom.outputs.image_digest }}
        run: |
          IMAGE_REF="${IMAGE_TAG}@${IMAGE_DIGEST}"

          echo "=========================================="
          echo "Verificando firma:"
          echo "$IMAGE_REF"
          echo "=========================================="

          cosign verify \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$IMAGE_REF"
