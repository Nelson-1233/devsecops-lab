name: Pipeline DevSecOps End-to-End

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:

  # ============================================================
  # 1. SECRET SCANNING
  # ============================================================
  secret-scanning:
    name: 1. Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 2. SAST - ANÁLISIS ESTÁTICO
  # ============================================================
  sast:
    name: 2. SAST (Semgrep)
    needs: secret-scanning
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Ejecutar Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/security-audit


  # ============================================================
  # 3. SCA - ANÁLISIS DE DEPENDENCIAS
  # ============================================================
  sca:
    name: 3. SCA (Trivy Filesystem)
    needs: secret-scanning
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Escanear dependencias con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "app/"
          severity: "HIGH,CRITICAL"
          exit-code: "1"


  # ============================================================
  # 4. IaC SECURITY - CHECKOV
  # ============================================================
  iac-security:
    name: 4. IaC Security (Checkov)
    needs: secret-scanning
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Escanear Terraform y Dockerfile con Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: "."
          framework: "terraform,dockerfile"
          soft_fail: false
          skip_check: "CKV_AWS_18,CKV_AWS_21,CKV_AWS_144,CKV_AWS_145,CKV2_AWS_6,CKV2_AWS_61,CKV2_AWS_62,CKV_AWS_260,CKV2_AWS_5"


  # ============================================================
  # 5. BUILD, SBOM Y ESCANEO DE IMAGEN
  # ============================================================
  build-and-sbom:
    name: 5. Build, Container Scan & SBOM
    needs:
      - sast
      - sca
      - iac-security

    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:

      - name: Descargar código
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Login en GitHub Container Registry
      # --------------------------------------------------------
      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # Generar nombre y tag de imagen
      # --------------------------------------------------------
      - name: Extraer metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha


      # --------------------------------------------------------
      # Construir imagen Docker
      # Dockerfile está en la raíz del repositorio
      # --------------------------------------------------------
      - name: Compilar Imagen Docker Local
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}


      # --------------------------------------------------------
      # Generar SBOM
      # --------------------------------------------------------
      - name: Generar SBOM con Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json


      # --------------------------------------------------------
      # Publicar SBOM como artefacto
      # --------------------------------------------------------
      - name: Publicar SBOM como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json


      # --------------------------------------------------------
      # Escanear imagen Docker con Trivy
      # --------------------------------------------------------
      - name: Escaneo de Imagen Docker con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          severity: "CRITICAL"
          exit-code: "0"


      # --------------------------------------------------------
      # Publicar imagen en GHCR
      # --------------------------------------------------------
      - name: Publicar Imagen en GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}


  # ============================================================
  # 6. FIRMA CRIPTOGRÁFICA
  # ============================================================
  sign-container:
    name: 6. Firma de Artefacto (Cosign Keyless)
    needs: build-and-sbom
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:

      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v3.5.0


      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Firmar Imagen mediante Sigstore
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          cosign sign --yes "$IMAGE_REF"